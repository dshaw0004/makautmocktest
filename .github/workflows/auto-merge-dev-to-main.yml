name: Auto Merge Develop to Deploy

on:
  # Disable scheduled runs for now, as we want to trigger this manually until we confirm it works correctly.
  # schedule:
  #   # Runs every Monday at 00:00 UTC (12:00 AM)
  #   # Cron format: minute hour day-of-month month day-of-week
  #   # 0 0 * * 1 means: At 00:00 on Monday
  #   - cron: '0 0 * * 1'

  # Allows manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-develop-to-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "dsx[bot]"
          git config user.email "dsx[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin

      - name: Merge dev into main
        run: |
          git checkout main
          git merge origin/dev --no-ff -m "chore: auto-merge dev to main"

      - name: Push changes
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create summary
        if: success()
        run: |
          echo "✅ Successfully merged dev into main" >> $GITHUB_STEP_SUMMARY
          echo "- Merge completed at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- Latest commit: $(git log -1 --pretty=format:'%h - %s')" >> $GITHUB_STEP_SUMMARY

      - name: Handle merge conflicts
        if: failure()
        run: |
          echo "❌ Merge failed - likely due to conflicts" >> $GITHUB_STEP_SUMMARY
          echo "Please resolve conflicts manually" >> $GITHUB_STEP_SUMMARY
          git merge --abort || true